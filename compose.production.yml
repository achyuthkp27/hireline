# Hireline with Docker Compose (see the installation guide, https://github.com/achyuthkp27/hireline/tree/main/docs). Save this
# file as compose.yml in a folder of its own, put POSTGRES_PASSWORD,
# HIRELINE_PASSWORD (a hash of your password, from `docker run --rm -it
# ghcr.io/achyuthkp27/hireline hash-password`) and HIRELINE_SECRET in a .env file
# next to it, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hireline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hireline
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireline -d hireline"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${HIRELINE_IMAGE:-ghcr.io/achyuthkp27/hireline:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hireline:${POSTGRES_PASSWORD}@db:5432/hireline
      HIRELINE_PASSWORD: ${HIRELINE_PASSWORD:?Set HIRELINE_PASSWORD in .env to a hash from hash-password}
      HIRELINE_SECRET: ${HIRELINE_SECRET:?Set HIRELINE_SECRET in .env}
      HIRELINE_BACKUP_RETENTION_DAYS: ${HIRELINE_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-}
      HIRELINE_AI_PROVIDER: ${HIRELINE_AI_PROVIDER:-}
      HIRELINE_AI_URL: ${HIRELINE_AI_URL:-}
      HIRELINE_AI_MODEL: ${HIRELINE_AI_MODEL:-}
      HIRELINE_AI_KEY: ${HIRELINE_AI_KEY:-}
      HIRELINE_AI_TIMEOUT_SECONDS: ${HIRELINE_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, Hireline asks after sign-in; on or off answers in advance (see Privacy in the docs).
      HIRELINE_TELEMETRY: ${HIRELINE_TELEMETRY:-}
      # Defaults for Settings → Job search.
      HIRELINE_JOBS_SOURCE: ${HIRELINE_JOBS_SOURCE:-}
      HIRELINE_JSEARCH_KEY: ${HIRELINE_JSEARCH_KEY:-}
      HIRELINE_JSEARCH_HOST: ${HIRELINE_JSEARCH_HOST:-}
      HIRELINE_ADZUNA_APP_ID: ${HIRELINE_ADZUNA_APP_ID:-}
      HIRELINE_ADZUNA_KEY: ${HIRELINE_ADZUNA_KEY:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      HIRELINE_GOOGLE_CLIENT_ID: ${HIRELINE_GOOGLE_CLIENT_ID:-}
      HIRELINE_GOOGLE_CLIENT_SECRET: ${HIRELINE_GOOGLE_CLIENT_SECRET:-}
      # The address Hireline is reached at, for Google's redirect.
      HIRELINE_PUBLIC_URL: ${HIRELINE_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${HIRELINE_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the docs). Hireline reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.6
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
